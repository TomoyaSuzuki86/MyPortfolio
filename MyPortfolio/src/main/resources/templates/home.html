<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ホーム画面</title>
	<!-- BootstrapのCSSを追加 -->
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<link rel="stylesheet" href="/css/common_styles.css">
	<style>
		.title {
			font-size: 2rem;
			font-weight: bold;
			color: #0066cc;
			text-align: center;
			margin-bottom: 30px;
		}

		.task-list-header {
			font-size: 1.4rem;
			color: #444;
			font-weight: bold;
			margin-bottom: 20px;
		}

		.btn-primary {
			display: block;
			width: fit-content;
			margin: 20px auto;
			padding: 10px 20px;
			background-color: #007bff;
			border: none;
			border-radius: 4px;
			font-weight: bold;
		}

		.btn-primary:hover {
			background-color: #0056b3;
		}

		.logout-button {
			position: relative;
			display: block;
			width: 100%;
			text-align: right;
			background-color: transparent;
			border: none;
			color: #0066cc;
			font-size: 1rem;
			text-decoration: underline;
			cursor: pointer;
		}

		.task-edit-button {
			display: inline-block;
			margin: 15px 0;
			background-color: #007bff;
			color: #fff;
			padding: 8px 16px;
			border: none;
			border-radius: 4px;
			text-align: center;
			text-decoration: none;
		}

		.task-edit-button:hover {
			background-color: #0056b3;
		}

		.celebration {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			background: rgba(0, 0, 0, 0.7);
			z-index: 1000;
			display: none;
		}

		.celebration img {
			width: 100%;
			height: auto;
		}

		.modal-header .close {
			padding: 1rem 1rem;
			margin: -1rem -1rem -1rem 0;
		}
	</style>
</head>

<body>
	<div class="container">
		<a class="logout-button" th:href="@{/home/logout}">
			<i class="fas fa-sign-out-alt logout-icon"></i> ログアウト
		</a>
		<div class="title">ホーム画面</div>

		<!-- 今日のタスク一覧 -->
		<div class="task-list">
			<div class="task-list-header">今日のタスク一覧</div>
			<table class="table">
				<thead>
					<tr>
						<th>タスク名</th>
						<th>目標時間</th>
						<th>実績時間</th>
						<th>進捗状況（達成率）</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="task : ${homeForm.tasksList}"
						th:attr="data-taskid=${task.taskId}, data-taskname=${task.taskName}, data-targettime=${task.targetTime}, data-toggle='modal', data-target='#achievementInputModal'">
						<td th:text="${task.taskName}"></td>
						<td th:text="${task.targetTime} + ' min'"></td>
						<td th:text="${task.actualTime} + ' min'"></td>
						<td th:text="${task.achievementRate} + '%'" class="taskAchievementRate"></td>
					</tr>
				</tbody>
			</table>
			<button type="button" class="btn btn-primary" data-toggle="modal"
				data-target="#taskEditModal">タスク追加</button>
		</div>

		<!-- 進捗サマリ -->
		<div class="summary-container">
			<div class="summary-title">進捗サマリ</div>
			<div class="row">
				<div th:each="task : ${homeForm.tasksList}" class="col-md-6 text-center mb-4">
					<h4 th:text="${task.taskName}">タスク名</h4>
					<div class="circle">
						<svg width="150" height="150">
							<circle cx="75" cy="75" r="60" stroke="#ddd" stroke-width="10" fill="none" />
							<circle cx="75" cy="75" r="60" stroke="#007bff" stroke-width="10" fill="none"
								stroke-dasharray="377"
								th:attr="stroke-dashoffset=${task.achievementRate > 100 ? 0 : (377 - (task.achievementRate / 100.0) * 377)}" />
						</svg>
						<div th:text="${task.achievementRate + '%'}">-</div>
					</div>
				</div>
			</div>
		</div>

	</div>

	<!-- タスク追加用のモーダル画面 -->
	<div class="modal fade" id="taskEditModal" tabindex="-1" role="dialog" aria-labelledby="taskEditModalLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered" role="document">
			<div class="modal-content">
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title" id="taskEditModalLabel">タスク追加</h5>
					<button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<form id="taskEditForm" th:action="@{/home/editTask}" method="post">
					<div class="modal-body">
						<div class="form-group">
							<label for="editTaskName" class="font-weight-bold">タスク名</label>
							<input type="text" class="form-control border-primary shadow-sm" id="editTaskName"
								name="taskName" placeholder="タスク名を入力">
						</div>
						<div class="form-group">
							<label for="editTargetTime" class="font-weight-bold">目標時間</label>
							<input type="number" class="form-control border-primary shadow-sm" id="editTargetTime"
								name="targetTime" placeholder="分単位で入力">
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary" data-dismiss="modal">キャンセル</button>
						<button type="submit" class="btn btn-success">登録</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- 実績入力用のモーダル画面 -->
	<div class="modal fade" id="achievementInputModal" tabindex="-1" role="dialog"
		aria-labelledby="achievementInputModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered" role="document">
			<div class="modal-content">
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title" id="achievementInputModalLabel">実績入力</h5>
					<form th:action="@{/home/deleteTask}" method="post" class="delete-task ml-auto">
						<input type="hidden" id="deleteTaskId" name="taskId">
						<button type="submit" class="btn btn-danger btn-sm">タスク削除</button>
					</form>
					<button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<form id="achievementInputForm" th:action="@{/home/addAchievement}" method="post">
					<div class="modal-body">
						<input type="hidden" id="achievementTaskId" name="taskId">
						<div class="form-group">
							<label for="achievementTaskName" class="font-weight-bold">タスク名</label>
							<input type="text" class="form-control-plaintext" id="achievementTaskName" name="taskName"
								readonly>
						</div>
						<div id="achievementContainer">
							<div class="form-group">
								<label for="achievementDescription" class="font-weight-bold">作業内容</label>
								<input type="text" class="form-control border-primary shadow-sm"
									id="achievementDescription" name="achievementDetails[0].description"
									placeholder="作業内容を入力">
							</div>
							<div class="form-group">
								<label for="achievementActualTime" class="font-weight-bold">作業時間</label>
								<input type="number" class="form-control border-primary shadow-sm"
									id="achievementActualTime" name="achievementDetails[0].actualTime"
									placeholder="分単位で入力">
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary" data-dismiss="modal">キャンセル</button>
						<button type="submit" class="btn btn-success">登録</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- hidden フィールドで達成率100%フラグを渡す -->
	<input type="hidden" id="hasAchievement100" th:value="${homeForm.hasAchievement100}" />
	<!-- お祝い用のGIFアニメーション -->
	<div id="celebration" class="celebration">
		<img src="/images/celebration.gif" alt="Congratulations!">
	</div>


	<!-- JavaScript -->
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
	<script>
		// タスク追加モーダルが開かれたときにタスクの情報をフォームにセットするスクリプト
		$('#taskEditModal').on('show.bs.modal', function (event) {
			var button = $(event.relatedTarget); // モーダルを開いたボタン
			var taskName = button.data('taskname'); // データ属性からタスク名を取得
			var targetTime = button.data('targettime'); // データ属性から目標時間を取得

			var modal = $(this);
			modal.find('#taskId').val(null); // フォームにタスクID(null)をセット
			modal.find('#taskName').val(taskName); // フォームにタスク名をセット
			modal.find('#targetTime').val(targetTime); // フォームに目標時間をセット
		});

		// 実績入力モーダルが開かれるときにタスク情報をモーダルに設定するスクリプト
		$('#achievementInputModal').on('show.bs.modal', function (event) {
			var button = $(event.relatedTarget); // モーダルを開いたボタン
			var taskId = button.data('taskid'); // データ属性からタスクIDを取得
			var taskName = button.data('taskname'); // データ属性からタスク名を取得
			var targetTime = button.data('targettime'); // データ属性から目標時間を取得
			var deleteTaskId = button.data('taskid'); // データ属性からタスクIDを取得（タスク削除用）

			var modal = $(this);
			modal.find('#achievementTaskId').val(taskId); // hidden フィールドにタスクIDを設定
			modal.find('#achievementTaskName').val(taskName); // readonly のタスク名フィールドに設定
			modal.find('#deleteTaskId').val(deleteTaskId); // hidden フィールドにタスクIDを設定
		});

		$(document).ready(function () {
			// hidden フィールドの値を取得
			var hasAchievement100 = $('#hasAchievement100').val();

			// 達成率100%のタスクが存在する場合、GIFを表示
			if (hasAchievement100 === 'true') {
				$('#celebration').fadeIn(1000).delay(1000).fadeOut(1000);
			}
		});
	</script>
</body>

</html>
